# Project-wide Gradle settings.
# Match this Windows/JDK native encoding for Gradle worker paths containing Cyrillic.
org.gradle.jvmargs=-Xmx640m -Dfile.encoding=windows-1251
org.gradle.workers.max=1
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Allow non-ASCII characters in project path (кириллица в пути "Новая папка")
android.overridePathCheck=true

# Point Gradle to JDK 21 bundled with IntelliJ IDEA / Android Studio
org.gradle.java.home=C:\\Program Files\\JetBrains\\IntelliJ IDEA 2024.3.5\\jbr
